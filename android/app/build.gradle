plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ajandam.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ajandam.app"
        minSdk 24
        targetSdk 34
        versionCode 22          // NATIVE_CODE: raise when the Java side changes (new APK needed)
        versionName "5.2"
    }

    signingConfigs {
        release {
            storeFile file("../../keys/ajandam-release.jks")
            storePassword "ajandam-2026"
            keyAlias "ajandam"
            keyPassword "ajandam-2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
